<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="semShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102538" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#FAF8F4" />

  <g filter="url(#semShadow)">
    <rect x="80" y="60" width="640" height="480" rx="20" fill="#FFFFFF" stroke="#E1E4E6" stroke-width="2" />

    <!-- Canvas Tote Bag -->
    <g transform="translate(130, 110)">
      <!-- Tote Straps -->
      <path d="M50 40c0-60 120-60 120 0" fill="none" stroke="#D3BFA7" stroke-width="16" stroke-linecap="round" />
      <!-- Tote Body -->
      <path d="M10 40h200l-15 280H35z" fill="#EFE5D8" stroke="#D8C7B0" stroke-width="2" />
      <rect x="50" y="120" width="120" height="90" rx="8" fill="#17324D" />
      <text x="110" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ANNUAL</text>
      <text x="110" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#087F8C" text-anchor="middle">CONFERENCE</text>
    </g>

    <!-- Spiral Eco Notebook -->
    <g transform="translate(380, 110)">
      <rect x="25" y="0" width="190" height="260" rx="8" fill="#C58B55" />
      <rect x="35" y="10" width="170" height="240" rx="6" fill="#FAF8F4" />
      <!-- Spiral Wire -->
      <g fill="#17324D">
        <circle cx="20" cy="25" r="5" />
        <circle cx="20" cy="55" r="5" />
        <circle cx="20" cy="85" r="5" />
        <circle cx="20" cy="115" r="5" />
        <circle cx="20" cy="145" r="5" />
        <circle cx="20" cy="175" r="5" />
        <circle cx="20" cy="205" r="5" />
        <circle cx="20" cy="235" r="5" />
      </g>
      <text x="120" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#17324D" text-anchor="middle">AGENDA & NOTES</text>
      <line x1="60" y1="110" x2="180" y2="110" stroke="#E1E4E6" stroke-width="2" />
      <line x1="60" y1="135" x2="180" y2="135" stroke="#E1E4E6" stroke-width="2" />
      <line x1="60" y1="160" x2="180" y2="160" stroke="#E1E4E6" stroke-width="2" />
      <line x1="60" y1="185" x2="180" y2="185" stroke="#E1E4E6" stroke-width="2" />
      <rect x="70" y="210" width="100" height="20" rx="4" fill="#087F8C" />
      <text x="120" y="224" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#FFFFFF" text-anchor="middle">RECYCLED PAPER</text>
    </g>

    <!-- Conference Badge & Lanyard -->
    <g transform="translate(380, 390)">
      <rect width="280" height="90" rx="8" fill="#F0EEE8" stroke="#E1E4E6" stroke-width="1.5" />
      <rect x="15" y="15" width="60" height="60" rx="6" fill="#17324D" />
      <text x="45" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">PASS</text>
      <text x="95" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#17324D">EVENT BADGE & LANYARD</text>
      <text x="95" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#64717D">Full Color Print 2cm + Metal Hook</text>
    </g>

    <!-- Pen in Loop -->
    <g transform="translate(600, 110)">
      <rect x="0" y="15" width="16" height="230" rx="8" fill="#17324D" />
      <polygon points="0,245 16,245 8,265" fill="#087F8C" />
      <rect x="12" y="30" width="4" height="60" rx="2" fill="#C58B55" />
    </g>
  </g>
</svg>
