<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="hampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F9F6F0" />
    </linearGradient>
    <filter id="hampShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102538" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#FAF8F4" />

  <g filter="url(#hampShadow)">
    <rect x="80" y="60" width="640" height="480" rx="20" fill="url(#hampGrad)" stroke="#E1E4E6" stroke-width="2" />

    <!-- Rigid Luxury Hamper Box Lid & Base -->
    <rect x="130" y="110" width="540" height="340" rx="14" fill="#17324D" />
    <rect x="145" y="125" width="510" height="310" rx="10" fill="#102538" />

    <!-- Gold Ribbon Crossing -->
    <rect x="385" y="110" width="30" height="340" fill="#C58B55" />
    <rect x="130" y="265" width="540" height="30" fill="#C58B55" />

    <!-- Gold Bow Center -->
    <circle cx="400" cy="280" r="28" fill="#E8D3BF" stroke="#C58B55" stroke-width="3" />
    <path d="M400 280c-25-30-60-20-40 0s35 15 40 0z" fill="#C58B55" />
    <path d="M400 280c25-30 60-20 40 0s-35 15-40 0z" fill="#C58B55" />

    <!-- Hamper Items Previews (Mug, Cookies, Greeting Card) -->
    <!-- Artisan Mug -->
    <g transform="translate(180, 160)">
      <rect width="70" height="85" rx="8" fill="#FAF8F4" />
      <path d="M70 20h15c10 0 10 40 0 40h-15" fill="none" stroke="#FAF8F4" stroke-width="8" stroke-linecap="round" />
      <text x="35" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#17324D" text-anchor="middle">ARTISAN</text>
    </g>

    <!-- Gourmet Cookies Jar -->
    <g transform="translate(480, 150)">
      <rect x="10" y="0" width="80" height="15" rx="4" fill="#C58B55" />
      <rect x="0" y="15" width="100" height="90" rx="10" fill="#FAF8F4" fill-opacity="0.9" />
      <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#17324D" text-anchor="middle">GOURMET JAR</text>
    </g>

    <!-- Corporate Greeting Card with Gold Foil -->
    <g transform="translate(180, 320)">
      <rect width="140" height="90" rx="6" fill="#FAF8F4" stroke="#C58B55" stroke-width="1.5" />
      <line x1="20" y1="30" x2="120" y2="30" stroke="#C58B55" stroke-width="2" />
      <line x1="20" y1="50" x2="100" y2="50" stroke="#E1E4E6" stroke-width="1.5" />
      <line x1="20" y1="65" x2="110" y2="65" stroke="#E1E4E6" stroke-width="1.5" />
      <text x="70" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#C58B55" text-anchor="middle">GREETING CARD</text>
    </g>

    <!-- Tea Tin -->
    <g transform="translate(480, 320)">
      <rect width="90" height="90" rx="8" fill="#087F8C" />
      <rect x="10" y="15" width="70" height="30" rx="4" fill="#FFFFFF" fill-opacity="0.15" />
      <text x="45" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" text-anchor="middle">PREMIUM TEA</text>
      <text x="45" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#B2DFE4" text-anchor="middle">ARTISAN BLEND</text>
    </g>

    <!-- Bottom Caption -->
    <text x="400" y="495" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#17324D" text-anchor="middle">HAMPERS KORPORAT & APRESIASI TAHUNAN</text>
  </g>
</svg>
