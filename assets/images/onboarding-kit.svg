<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C79E" />
      <stop offset="100%" stop-color="#CFA775" />
    </linearGradient>
    <filter id="obShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#102538" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#FAF8F4" />

  <!-- Kraft Box Container -->
  <g filter="url(#obShadow)">
    <rect x="90" y="80" width="620" height="440" rx="16" fill="url(#kraftGrad)" stroke="#B38B57" stroke-width="2" />
    <rect x="110" y="100" width="580" height="400" rx="12" fill="#F8EFE4" />

    <!-- Welcome Card Top Banner -->
    <rect x="140" y="125" width="520" height="45" rx="8" fill="#17324D" />
    <text x="400" y="153" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#FAF8F4" text-anchor="middle" letter-spacing="2">WELCOME TO THE TEAM KIT</text>

    <!-- Hardcover Notebook -->
    <g transform="translate(140, 190)">
      <rect width="180" height="240" rx="8" fill="#087F8C" />
      <path d="M0 0h10v240H0z" fill="#066872" />
      <rect x="35" y="60" width="110" height="24" rx="4" fill="#FFFFFF" fill-opacity="0.15" />
      <text x="90" y="77" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">NEW HIRES GUIDE</text>
      <circle cx="90" cy="140" r="28" fill="#FFFFFF" fill-opacity="0.2" />
      <text x="90" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">2026</text>
    </g>

    <!-- Vacuum Flask / Water Bottle -->
    <g transform="translate(350, 190)">
      <rect x="20" y="0" width="70" height="18" rx="5" fill="#102538" />
      <rect x="12" y="18" width="86" height="222" rx="14" fill="#17324D" />
      <circle cx="55" cy="80" r="16" fill="#C58B55" fill-opacity="0.2" />
      <text x="55" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#E8D3BF" text-anchor="middle">CORP</text>
      <text x="55" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#8EA3B8" text-anchor="middle">INSULATED</text>
    </g>

    <!-- Lanyard with ID Card Badge -->
    <g transform="translate(480, 190)">
      <!-- Lanyard Strap Loop -->
      <path d="M30 0c0 40 40 60 40 90s-20 30-20 30" fill="none" stroke="#17324D" stroke-width="12" stroke-linecap="round" />
      <rect x="100" y="10" width="18" height="200" rx="9" fill="#087F8C" />
      <polygon points="100,210 118,210 109,225" fill="#066872" />
      <!-- ID Badge Holder -->
      <rect x="40" y="110" width="120" height="150" rx="8" fill="#FFFFFF" stroke="#E1E4E6" stroke-width="2" />
      <rect x="75" y="116" width="50" height="6" rx="3" fill="#17324D" />
      <circle cx="100" cy="155" r="22" fill="#F0EEE8" />
      <rect x="60" y="190" width="80" height="10" rx="3" fill="#17324D" />
      <rect x="70" y="210" width="60" height="6" rx="2" fill="#64717D" />
      <rect x="75" y="224" width="50" height="5" rx="2" fill="#087F8C" />
    </g>

    <!-- Enamel Pin & Pen Pack -->
    <g transform="translate(140, 445)">
      <rect width="180" height="35" rx="6" fill="#17324D" />
      <text x="90" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#C58B55" text-anchor="middle" letter-spacing="1">CUSTOM HARD ENAMEL PIN</text>
    </g>
    <g transform="translate(350, 445)">
      <rect width="270" height="35" rx="6" fill="#FFFFFF" stroke="#E1E4E6" stroke-width="1.5" />
      <text x="135" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#24313D" text-anchor="middle">ROLLERBALL PEN + STICKER PACK</text>
    </g>
  </g>
</svg>
