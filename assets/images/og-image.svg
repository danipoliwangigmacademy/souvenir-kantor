  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Accent Geometry -->
  <circle cx="1080" cy="120" r="320" fill="#087F8C" fill-opacity="0.15" />
  <circle cx="150" cy="550" r="240" fill="#C58B55" fill-opacity="0.1" />

  <!-- Brand Eyebrow -->
  <g transform="translate(100, 140)">
