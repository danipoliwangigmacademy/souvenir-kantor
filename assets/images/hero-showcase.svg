<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#ECE7DC" />
    </linearGradient>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2EDE3" />
      <stop offset="100%" stop-color="#E2DBD0" />
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#102538" flood-opacity="0.14" />
    </filter>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A06A" />
      <stop offset="100%" stop-color="#A56E39" />
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Studio Surface -->
  <rect width="1200" height="675" fill="url(#heroBg)" />

  <!-- Soft Ambient Wall & Table Horizon -->
  <rect y="480" width="1200" height="195" fill="url(#deskWood)" />
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#D5CCC0" stroke-width="2" />

  <!-- Main Presentation Tray & Box (Center) -->
  <g filter="url(#heroShadow)">
    <rect x="220" y="90" width="760" height="480" rx="24" fill="#FFFFFF" stroke="#E1E4E6" stroke-width="2" />
    <rect x="240" y="110" width="720" height="440" rx="16" fill="#F8F6F0" stroke="#DFDBD2" stroke-width="1.5" />

    <!-- Hardcover Executive Leather Notebook -->
    <g transform="translate(280, 150)">
      <rect width="250" height="340" rx="12" fill="#17324D" />
      <path d="M0 0h16v340H0z" fill="#102538" />
      <!-- Gold Embossing -->
      <rect x="50" y="90" width="40" height="40" rx="8" fill="none" stroke="url(#goldH)" stroke-width="3" />
      <line x1="60" y1="110" x2="80" y2="110" stroke="url(#goldH)" stroke-width="2.5" />
      <text x="105" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#E8D3BF" letter-spacing="2">CORPORATE</text>
      <text x="105" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#8EA3B8" letter-spacing="3">COLLECTION</text>
      <!-- Gold Bookmark Ribbon -->
      <path d="M220 0h18v220l-9-12-9 12z" fill="url(#goldH)" />
    </g>

    <!-- Matte Vacuum Tumbler (Teal Accent) -->
    <g transform="translate(590, 150)">
      <rect x="30" y="0" width="120" height="30" rx="8" fill="#102538" />
      <rect x="20" y="30" width="140" height="260" rx="18" fill="#087F8C" />
      <circle cx="90" cy="110" r="32" fill="#FFFFFF" fill-opacity="0.1" />
      <text x="90" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">INSULATED</text>
      <text x="90" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#B2DFE4" text-anchor="middle">500 ML / 12H HOT & COLD</text>
    </g>

    <!-- Metal Ballpoint Pen with Gold Trim -->
    <g transform="translate(780, 150)">
      <rect x="15" y="20" width="18" height="280" rx="9" fill="url(#goldH)" />
      <rect x="18" y="20" width="12" height="70" rx="3" fill="#694318" />
      <rect x="29" y="30" width="5" height="80" rx="2.5" fill="#FFFFFF" />
      <polygon points="15,300 33,300 24,330" fill="#17324D" />
    </g>

    <!-- Metal Cardholder / Powerbank -->
    <g transform="translate(590, 430)">
      <rect width="210" height="60" rx="10" fill="#17324D" stroke="url(#goldH)" stroke-width="1.5" />
      <rect width="210" height="22" rx="10" fill="#102538" />
      <text x="105" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FAF8F4" text-anchor="middle" letter-spacing="1">EXECUTIVE CARD CASE</text>
    </g>
  </g>

  <!-- Left Floating Badge: B2B Procurement Ready -->
  <g transform="translate(100, 260)" filter="url(#heroShadow)">
    <rect width="180" height="85" rx="14" fill="#FFFFFF" stroke="#E1E4E6" stroke-width="1.5" />
    <circle cx="35" cy="42" r="18" fill="#247A55" fill-opacity="0.12" />
    <text x="35" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#247A55" text-anchor="middle">✓</text>
    <text x="65" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#17324D">B2B Ready</text>
    <text x="65" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#64717D">Faktur Pajak & MOU</text>
  </g>

  <!-- Right Floating Badge: Custom Logo Precision -->
  <g transform="translate(930, 240)" filter="url(#heroShadow)">
    <rect width="190" height="85" rx="14" fill="#FFFFFF" stroke="#E1E4E6" stroke-width="1.5" />
    <circle cx="35" cy="42" r="18" fill="#087F8C" fill-opacity="0.12" />
    <text x="35" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#087F8C" text-anchor="middle">★</text>
    <text x="65" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#17324D">Precision Logo</text>
    <text x="65" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#64717D">Grafir, UV & Bordir</text>
  </g>
</svg>
