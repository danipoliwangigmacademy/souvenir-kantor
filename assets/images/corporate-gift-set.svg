<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#EFECE6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102538" flood-opacity="0.12" />
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A06A" />
      <stop offset="100%" stop-color="#A56E39" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Gift Box Outer Tray -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="80" width="600" height="440" rx="20" fill="#FFFFFF" stroke="#E1E4E6" stroke-width="2" />
    <rect x="115" y="95" width="570" height="410" rx="14" fill="#F4F1EA" stroke="#DFDBD2" stroke-width="1.5" />

    <!-- Executive Hardcover Leather Notebook -->
    <g transform="translate(150, 130)">
      <rect width="210" height="300" rx="10" fill="#17324D" />
      <!-- Book Spine highlight & gold ribbon -->
      <path d="M0 0h12v300H0z" fill="#102538" />
      <path d="M190 0h16v180l-8-10-8 10z" fill="url(#goldGrad)" />
      <!-- Embossed Brand Logo -->
      <rect x="40" y="80" width="30" height="30" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
      <line x1="45" y1="95" x2="65" y2="95" stroke="url(#goldGrad)" stroke-width="2" />
      <text x="80" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#E8D3BF" letter-spacing="1.5">EXECUTIVE</text>
      <text x="40" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#8EA3B8" letter-spacing="2">EDITION NOTEBOOK</text>
      <!-- Elastic Band -->
      <line x1="180" y1="0" x2="180" y2="300" stroke="#102538" stroke-width="6" />
    </g>

    <!-- Matte Vacuum Tumbler -->
    <g transform="translate(420, 130)">
      <rect x="25" y="0" width="100" height="24" rx="6" fill="#102538" />
      <rect x="20" y="24" width="110" height="230" rx="16" fill="#087F8C" />
      <!-- Tumbler Brand Accent -->
      <line x1="20" y1="50" x2="130" y2="50" stroke="#066872" stroke-width="2" />
      <text x="75" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">TITAN 500ML</text>
      <text x="75" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="9" fill="#B2DFE4" text-anchor="middle">DOUBLE WALL INSULATED</text>
    </g>

    <!-- Metal Ballpoint Pen -->
    <g transform="translate(585, 130)">
      <rect x="12" y="20" width="16" height="240" rx="8" fill="url(#goldGrad)" />
      <rect x="14" y="20" width="12" height="60" rx="3" fill="#694318" />
      <rect x="24" y="30" width="4" height="70" rx="2" fill="#FFFFFF" />
      <polygon points="12,260 28,260 20,285" fill="#17324D" />
    </g>

    <!-- Metal Business Card Holder -->
    <g transform="translate(420, 395)">
      <rect width="180" height="75" rx="8" fill="#17324D" stroke="url(#goldGrad)" stroke-width="1.5" />
      <rect x="0" y="0" width="180" height="26" fill="#102538" rx="8" />
      <text x="90" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#FAF8F4" text-anchor="middle" letter-spacing="1.5">METAL CARD CASE</text>
    </g>
  </g>

  <!-- Category Tag -->
  <g transform="translate(530, 490)">
    <rect width="140" height="32" rx="16" fill="#17324D" />
    <text x="70" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#C58B55" text-anchor="middle" letter-spacing="1">PREMIUM GIFT SET</text>
  </g>
</svg>
